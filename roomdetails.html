<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Details | HostelPro</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #172033;
        }

        /* HEADER */
        header {
            background: #172033;
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #2563eb;
        }

        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .hamburger {
            display: none;
            font-size: 28px;
            cursor: pointer;
        }

        /* MOBILE MENU */
        .mobile-menu {
            display: none;
            background: #172033;
            padding: 15px 25px;
        }

        .mobile-menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .mobile-menu.open {
            display: block;
        }

        /* MAIN */
        main {
            padding: 35px;
            max-width: 1100px;
            margin: auto;
        }

        .back-link {
            display: inline-block;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-header p {
            color: #64748b;
        }

        .status {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status.available {
            background: #dcfce7;
            color: #166534;
        }

        .status.full {
            background: #fee2e2;
            color: #991b1b;
        }

        .status.inactive {
            background: #e2e8f0;
            color: #475569;
        }

        /* CARD */
        .card {
            background: white;
            border-radius: 13px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 22px;
        }

        .card h2 {
            font-size: 19px;
            margin-bottom: 18px;
        }

        /* INFO GRID */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .info-item {
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .info-item span {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .info-item strong {
            font-size: 17px;
        }

        /* STATS ROW */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #64748b;
            font-size: 13px;
        }

        /* BED LIST */
        .bed-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .bed-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            background: #f8fafc;
        }

        .bed-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .bed-label {
            font-weight: bold;
            font-size: 15px;
        }

        .bed-status {
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .bed-status.available {
            background: #dcfce7;
            color: #166534;
        }

        .bed-status.occupied {
            background: #fee2e2;
            color: #991b1b;
        }

        .bed-status.maintenance {
            background: #fef3c7;
            color: #92400e;
        }

        .bed-status.reserved {
            background: #e0e7ff;
            color: #3730a3;
        }

        .bed-meta {
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
        }

        .bed-meta strong {
            color: #172033;
        }

        /* STATES */
        .message {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #64748b;
        }

        .error {
            color: #dc2626;
        }

        /* NEXA */
        .nexa {
            position: fixed;
            bottom: 22px;
            left: 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 5px 18px rgba(0,0,0,0.2);
            z-index: 2000;
        }

        .nexa:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        /* FOOTER */
        footer {
            margin-top: 50px;
            background: #172033;
            color: white;
            text-align: center;
            padding: 25px;
        }

        footer p {
            color: #cbd5e1;
            font-size: 14px;
        }

        /* RESPONSIVE */
        @media (max-width: 750px) {
            header {
                padding: 15px 20px;
            }

            nav {
                display: none;
            }

            .hamburger {
                display: block;
            }

            main {
                padding: 25px 18px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .stats-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 500px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Hostel<span>Pro</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="hostels.html">Hostels</a>
        <a href="rooms.html">Rooms</a>
        <a href="beds.html">Beds</a>
        <a href="announcements.html">Announcements</a>
        <a href="login.html">Login</a>
        <a href="register.html">Create Account</a>
    </nav>

    <div class="hamburger" id="hamburger">☰</div>
</header>

<div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="hostels.html">Hostels</a>
    <a href="rooms.html">Rooms</a>
    <a href="beds.html">Rooms & Beds</a>
    <a href="announcements.html">Announcements</a>
    <a href="contact.html">Contact</a>
    <a href="help.html">Help & Support</a>
    <a href="login.html">Login</a>
    <a href="register.html">Create Account</a>
</div>

<main>

    <a href="rooms.html" class="back-link">
        ← Back to Rooms
    </a>

    <div id="roomDetails">

        <div class="message">
            Loading room details...
        </div>

    </div>

</main>

<!-- NEXA AI -->
<a href="nexa.html" class="nexa" title="Ask Nexa AI">
    AI
</a>

<footer>
    <p>© 2026 HostelPro. Hostel Management System.</p>
</footer>


<script>

    /* ================================
       SUPABASE CONFIGURATION
    ================================= */

    const SUPABASE_URL = "https://keeyaworqbjsjfekorhd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_BqwK9AWNmr07j6maco-EEQ_Tafq7rJ9";

    const { createClient } = supabase;

    const db = createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    /* ================================
       MOBILE MENU
    ================================= */

    const hamburger = document.getElementById("hamburger");
    const mobileMenu = document.getElementById("mobileMenu");

    hamburger.addEventListener("click", () => {
        mobileMenu.classList.toggle("open");
    });


    /* ================================
       GET ROOM ID FROM URL
    ================================= */

    function getRoomIdFromUrl() {

        const params = new URLSearchParams(window.location.search);

        return params.get("id");
    }


    /* ================================
       LOAD ROOM DETAILS
    ================================= */

    async function loadRoomDetails() {

        const container = document.getElementById("roomDetails");

        const roomId = getRoomIdFromUrl();

        if (!roomId) {

            container.innerHTML = `
                <div class="message error">
                    <h3>No room specified</h3>
                    <p>
                        This page needs a room id in the URL, e.g.
                        roomdetails.html?id=...
                    </p>
                </div>
            `;

            return;
        }

        container.innerHTML = `
            <div class="message">
                Loading room details...
            </div>
        `;

        try {

            /*
             * ROOM + HOSTEL
             */

            const { data: room, error: roomError } = await db
                .from("rooms")
                .select(`
                    id,
                    room_number,
                    hostel_id,
                    hostels:hostel_id (
                        id,
                        name,
                        location,
                        description,
                        status
                    )
                `)
                .eq("id", roomId)
                .maybeSingle();

            if (roomError) {
                throw roomError;
            }

            if (!room) {

                container.innerHTML = `
                    <div class="message error">
                        <h3>Room not found</h3>
                        <p>This room may have been removed or the link is invalid.</p>
                    </div>
                `;

                return;
            }


            /*
             * BEDS FOR THIS ROOM
             */

            const { data: bedsData, error: bedsError } = await db
                .from("beds")
                .select(`
                    id,
                    bed_number,
                    label,
                    status,
                    bed_position
                `)
                .eq("room_id", roomId)
                .order("bed_number", { ascending: true });

            if (bedsError) {
                throw bedsError;
            }

            const beds = bedsData || [];


            /*
             * OCCUPANTS
             *
             * For any occupied bed, find the active
             * allocation and the student's name.
             */

            let occupantsByBed = {};

            const bedIds = beds.map(bed => bed.id);

            if (bedIds.length) {

                const { data: allocations, error: allocError } = await db
                    .from("allocations")
                    .select(`
                        bed_id,
                        status,
                        profiles:student_id (
                            full_name,
                            student_id
                        )
                    `)
                    .in("bed_id", bedIds)
                    .eq("status", "active");

                if (!allocError && allocations) {

                    allocations.forEach(allocation => {
                        occupantsByBed[allocation.bed_id] = allocation.profiles;
                    });

                } else if (allocError) {

                    console.error("Error loading occupants:", allocError);

                }

            }


            /*
             * RENDER
             */

            renderRoom(room, beds, occupantsByBed);

        } catch (error) {

            console.error("Error loading room details:", error);

            container.innerHTML = `
                <div class="message error">
                    <h3>Unable to load room details</h3>
                    <p>${escapeHtml(error.message)}</p>
                </div>
            `;
        }
    }


    /* ================================
       ROOM STATUS
    ================================= */

    function getRoomStatus(totalBeds, availableBeds) {

        if (totalBeds === 0) {
            return "available";
        }

        if (availableBeds > 0) {
            return "available";
        }

        return "full";
    }


    /* ================================
       RENDER ROOM
    ================================= */

    function renderRoom(room, beds, occupantsByBed) {

        const container = document.getElementById("roomDetails");

        const hostel = room.hostels || {};

        const totalBeds = beds.length;

        const availableBeds = beds.filter(
            bed => String(bed.status || "").toLowerCase() === "available"
        ).length;

        const occupiedBeds = beds.filter(
            bed => String(bed.status || "").toLowerCase() === "occupied"
        ).length;

        const roomStatus = getRoomStatus(totalBeds, availableBeds);

        const statusText =
            roomStatus.charAt(0).toUpperCase() + roomStatus.slice(1);


        const bedListHtml = beds.length
            ? beds.map(bed => {

                const bedStatus =
                    String(bed.status || "unknown").toLowerCase();

                const bedStatusText =
                    bedStatus.charAt(0).toUpperCase() + bedStatus.slice(1);

                const occupant = occupantsByBed[bed.id];

                return `
                    <div class="bed-card">

                        <div class="bed-top">

                            <div class="bed-label">
                                ${escapeHtml(bed.label || bed.bed_number || "Bed")}
                            </div>

                            <span class="bed-status ${bedStatus}">
                                ${escapeHtml(bedStatusText)}
                            </span>

                        </div>

                        <div class="bed-meta">

                            ${
                                bed.bed_position
                                    ? `Position: <strong>${escapeHtml(bed.bed_position)}</strong><br>`
                                    : ""
                            }

                            ${
                                occupant
                                    ? `Occupant: <strong>${escapeHtml(occupant.full_name)}</strong>` +
                                      (
                                          occupant.student_id
                                              ? ` (${escapeHtml(occupant.student_id)})`
                                              : ""
                                      )
                                    : `Occupant: <strong>None</strong>`
                            }

                        </div>

                    </div>
                `;

            }).join("")
            : `
                <div class="message" style="grid-column:1/-1;">
                    No beds have been added to this room yet.
                </div>
            `;


        container.innerHTML = `

            <div class="page-header">

                <div>
                    <h1>Room ${escapeHtml(room.room_number)}</h1>
                    <p>${escapeHtml(hostel.name || "Hostel not assigned")}</p>
                </div>

                <span class="status ${roomStatus}">
                    ${escapeHtml(statusText)}
                </span>

            </div>


            <div class="stats-row">

                <div class="stat-card">
                    <h3>${totalBeds}</h3>
                    <p>Total Beds</p>
                </div>

                <div class="stat-card">
                    <h3>${availableBeds}</h3>
                    <p>Available Beds</p>
                </div>

                <div class="stat-card">
                    <h3>${occupiedBeds}</h3>
                    <p>Occupied Beds</p>
                </div>

            </div>


            <div class="card">

                <h2>Hostel Information</h2>

                <div class="info-grid">

                    <div class="info-item">
                        <span>Hostel Name</span>
                        <strong>${escapeHtml(hostel.name || "—")}</strong>
                    </div>

                    <div class="info-item">
                        <span>Location</span>
                        <strong>${escapeHtml(hostel.location || "—")}</strong>
                    </div>

                    <div class="info-item">
                        <span>Hostel Status</span>
                        <strong>${escapeHtml(hostel.status || "—")}</strong>
                    </div>

                </div>

                ${
                    hostel.description
                        ? `<p style="margin-top:16px;color:#64748b;font-size:14px;">${escapeHtml(hostel.description)}</p>`
                        : ""
                }

            </div>


            <div class="card">

                <h2>Beds in this Room</h2>

                <div class="bed-list">
                    ${bedListHtml}
                </div>

            </div>

        `;
    }


    /* ================================
       SECURITY / HTML ESCAPE
    ================================= */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* ================================
       START
    ================================= */

    loadRoomDetails();

</script>

</body>
</html>
