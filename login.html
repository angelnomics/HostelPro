
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HostelPro | Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            color: #172033;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 30px;
            color: #172033;
        }

        .logo span {
            color: #2563eb;
        }

        .logo p {
            margin-top: 7px;
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #2563eb;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #475569;
        }

        .remember input {
            width: auto;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .forgot {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #2563eb;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>Hostel<span>Pro</span></h1>
            <p>Hostel Management System</p>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>
                </div>
            </div>

            <label class="remember">
                <input type="checkbox" id="rememberEmail">
                Remember my email
            </label>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>

        <a href="#" class="forgot" id="forgotPassword">
            Forgot your password?
        </a>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

<script>
    const SUPABASE_URL = "https://keeyaworqbjsjfekorhd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_BqwK9AWNmr07j6maco-EEQ_Tafq7rJ9";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");
    const rememberEmail = document.getElementById("rememberEmail");
    const showPassword = document.getElementById("showPassword");
    const forgotPassword = document.getElementById("forgotPassword");

    const savedEmail = localStorage.getItem("hostelpro_login_email");

    if (savedEmail) {
        emailInput.value = savedEmail;
        rememberEmail.checked = true;
    }

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    function clearMessage() {
        message.textContent = "";
        message.className = "message";
    }

    showPassword.addEventListener("click", function () {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            showPassword.textContent = "Hide";
        } else {
            passwordInput.type = "password";
            showPassword.textContent = "Show";
        }
    });

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        clearMessage();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";

        try {
            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                throw error;
            }

            if (!data.user) {
                throw new Error("Unable to identify the logged-in user.");
            }

            if (rememberEmail.checked) {
                localStorage.setItem("hostelpro_login_email", email);
            } else {
                localStorage.removeItem("hostelpro_login_email");
            }

            const { data: profile, error: profileError } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "id, full_name, email, role, student_id, status"
                    )
                    .eq("id", data.user.id)
                    .single();

            if (profileError) {
                await supabaseClient.auth.signOut();
                throw new Error(
                    "Your account profile could not be found."
                );
            }

            if (profile.status && profile.status.toLowerCase() !== "active") {
                await supabaseClient.auth.signOut();
                throw new Error(
                    "Your account is not active. Please contact the administrator."
                );
            }

            showMessage("Login successful. Redirecting...", "success");

            const role = profile.role
                ? profile.role.toLowerCase()
                : "";

            setTimeout(() => {

                if (role === "admin") {
                    window.location.href = "admin_dashboard.html";

                } else if (role === "caretaker") {
                    window.location.href = "caretaker_dashboard.html";

                } else if (role === "warden") {
                    window.location.href = "warden.html";

                } else if (role === "student") {
                    window.location.href = "student_dashboard.html";

                } else {
                    supabaseClient.auth.signOut();

                    showMessage(
                        "Your account role is not configured correctly. Please contact the administrator.",
                        "error"
                    );

                    loginBtn.disabled = false;
                    loginBtn.textContent = "Login";
                }

            }, 800);

        } catch (error) {

            console.error("Login error:", error);

            showMessage(
                error.message || "Login failed. Please try again.",
                "error"
            );

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
        }
    });

    forgotPassword.addEventListener("click", async function (event) {
        event.preventDefault();

        clearMessage();

        const email = emailInput.value.trim();

        if (!email) {
            showMessage(
                "Enter your email address first.",
                "error"
            );
            emailInput.focus();
            return;
        }

        forgotPassword.textContent = "Sending...";

        try {

            const { error } =
                await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            window.location.origin +
                            "/reset_password.html"
                    }
                );

            if (error) {
                throw error;
            }

            showMessage(
                "Password reset instructions have been sent to your email.",
                "success"
            );

        } catch (error) {

            console.error("Password reset error:", error);

            showMessage(
                error.message ||
                "Unable to send password reset instructions.",
                "error"
            );

        } finally {
            forgotPassword.textContent =
                "Forgot your password?";
        }
    });
</script>

</body>
</html>
