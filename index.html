<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HostelPro | Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* ==============================
           SIDEBAR
        ============================== */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #172033;
            color: white;
            padding: 25px 16px;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 5px 10px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: #2563eb;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .logo h2 {
            font-size: 20px;
        }

        .logo small {
            color: #94a3b8;
            font-size: 11px;
        }

        .menu-title {
            margin: 25px 10px 10px;
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 12px;
            margin-bottom: 5px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 9px;
            transition: 0.25s;
            font-size: 14px;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.08);
            color: white;
            transform: translateX(4px);
        }

        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .sidebar-bottom {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .register {
            background: #00843d !important;
            color: white !important;
        }

        /* ==============================
           MAIN AREA
        ============================== */

        .main {
            margin-left: 250px;
            min-height: 100vh;

            /* IMPORTANT:
               Main area itself reveals when page loads */
            opacity: 0;
            transform: translateX(100px);
            animation: mainReveal 1.2s ease forwards;
        }

        @keyframes mainReveal {
            0% {
                opacity: 0;
                transform: translateX(100px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ==============================
           TOP BAR
        ============================== */

        .topbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e2e8f0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;

            position: sticky;
            top: 0;
            z-index: 500;
        }

        .welcome {
            font-size: 14px;
            color: #64748b;
        }

        .online {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #64748b;
        }

        .dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
        }

        .content {
            padding: 35px;
        }

        /* ==============================
           HERO
        ============================== */

        .hero {
            min-height: 500px;

            background:
                linear-gradient(
                    120deg,
                    #172033,
                    #2563eb
                );

            border-radius: 25px;

            display: flex;
            align-items: center;

            padding: 70px;

            color: white;

            overflow: hidden;

            position: relative;
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: rgba(255,255,255,0.05);

            right: -100px;
            bottom: -150px;
        }

        .hero-content {
            max-width: 700px;
            position: relative;
            z-index: 2;

            opacity: 0;

            transform: translateX(-80px);

            animation:
                heroReveal 1.2s ease 0.4s forwards;
        }

        @keyframes heroReveal {

            0% {
                opacity: 0;
                transform: translateX(-80px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }

        }

        .badge {
            display: inline-block;

            padding: 8px 14px;

            border-radius: 30px;

            background: rgba(255,255,255,0.12);

            font-size: 12px;

            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 58px;
            line-height: 1.05;
            margin-bottom: 20px;
        }

        .hero p {
            color: #dbeafe;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
            max-width: 620px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 22px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.25s;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .primary {
            background: white;
            color: #172033;
        }

        .secondary {
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
        }
else {

                window.location.href =
                    "hostels.html";

            }

        }

    </script>

</body>
</html>
